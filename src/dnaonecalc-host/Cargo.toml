[package]
name = "dnaonecalc-host"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
seam-tests = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
roxmltree = "0.21"
web-sys = { version = "0.3", features = ["Clipboard", "Navigator", "HtmlTextAreaElement", "HtmlInputElement", "HtmlElement", "HtmlAnchorElement", "InputEvent", "KeyboardEvent", "KeyboardEventInit", "MouseEvent", "MouseEventInit", "Event", "EventInit", "EventTarget", "Window", "Document", "Element", "Node", "NodeList", "CssStyleDeclaration", "DomRect", "Blob", "BlobPropertyBag", "Url", "File", "FileList", "FileReader", "Storage"] }
wasm-bindgen = "=0.2.117"
oxfml_core = { path = "../../../OxFml/crates/oxfml_core" }
oxfunc_core = { path = "../../../OxFunc/crates/oxfunc_core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["ssr"] }
oxvba_compiler = { package = "oxvba-compiler", path = "../../../OxVba/crates/oxvba-compiler" }
oxvba_host = { package = "oxvba-host", path = "../../../OxVba/crates/oxvba-host" }
oxvba_project = { package = "oxvba-project", path = "../../../OxVba/crates/oxvba-project" }
oxvba_runtime = { package = "oxvba-runtime", path = "../../../OxVba/crates/oxvba-runtime" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8.17", default-features = false, features = ["csr"] }
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
wasm-bindgen-test = "=0.3.67"
